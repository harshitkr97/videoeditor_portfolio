name: Keep Render backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Request backend health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 120 --retry 2
          https://videoeditor-portfolio-ezon.onrender.com/health
